
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <!-- 瀏覽器快取控制（輔助措施） -->
  <meta http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <base target="_top">

  <title>729群組簽到</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>

  <style>
    body {
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f6f9;
      color: #252525;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 400px;
      padding: 30px 24px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
      text-align: center;
      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;
    }

    #status {
      color: #555;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    #detail {
      display: block;
      color: #999;
      font-size: 12px;
      margin-top: 10px;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #06c755;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    a {
      display: block;
      margin-top: 16px;
      color: #1677ff;
      overflow-wrap: anywhere;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <main class="container">

    <h2>729群組簽到</h2>

    <p id="status" aria-live="polite">
      正在準備簽到，請稍候...
    </p>

    <small id="detail"></small>

    <!-- LINE 登入重試 -->
    <button id="loginRetry" hidden>
      重新連結 LINE
    </button>

    <!-- 重新開啟簽到頁面 -->
    <a id="restartLiff" hidden
       target="_top">
      重新開啟簽到頁面
    </a>

    <!-- LINE 身分確認成功 -->
    <section id="profileSection" hidden>

      <p id="profileName"></p>

      <button id="openForm">
        前往簽到
      </button>

      <a id="formFallback"
         target="_top"
         rel="noopener noreferrer">
        如果無法開啟簽到表單，請點擊這裡
      </a>

    </section>

  </main>


<script>
(() => {

  // ======================================
  // 1. 基本設定
  // ======================================

  const LIFF_ID = '2012446297-ML8LQcOg';

  const LIFF_URL =
    'https://liff.line.me/' + LIFF_ID;

  // 替換成自己的 Google 表單 viewform 網址
  const FORM_BASE_URL =
  'https://docs.google.com/forms/d/e/1FAIpQLSfSLhFDVZJoFhl3y2n87DRSLYR7IcgqXzuLqz_wUmn_EcFPJA/viewform';

  const NAME_ENTRY_ID = 'entry.1398967371';

  // 初始化最多等待 25 秒
  const INIT_TIMEOUT = 25000;

  // 防止登入重複執行
  const LOGIN_KEY = 'liff_login_attempt_' + LIFF_ID;

  let finalFormUrl = '';
  let loginAttemptedInThisPage = false;


  // ======================================
  // 2. DOM 元素
  // ======================================

  const statusElement =
    document.getElementById('status');

  const detailElement =
    document.getElementById('detail');

  const loginRetryButton =
    document.getElementById('loginRetry');

  const restartLiffLink =
    document.getElementById('restartLiff');

  const profileSection =
    document.getElementById('profileSection');

  const profileName =
    document.getElementById('profileName');

  const openFormButton =
    document.getElementById('openForm');

  const formFallback =
    document.getElementById('formFallback');


  // ======================================
  // 3. 畫面訊息
  // ======================================

  function setStatus(message, detail = '') {

    statusElement.textContent = message;
    detailElement.textContent = detail;

  }


  function showLoginRetry(message) {

    setStatus(message);

    loginRetryButton.hidden = false;

  }


  // ======================================
  // 4. 安全操作 SessionStorage
  // ======================================

  function getLoginAttempt() {

    try {
      return sessionStorage.getItem(LOGIN_KEY);
    } catch (error) {
      return null;
    }

  }


  function setLoginAttempt() {

    loginAttemptedInThisPage = true;

    try {
      sessionStorage.setItem(LOGIN_KEY, '1');
    } catch (error) {
      console.warn('SessionStorage unavailable');
    }

  }


  function clearLoginAttempt() {

    loginAttemptedInThisPage = false;

    try {
      sessionStorage.removeItem(LOGIN_KEY);
    } catch (error) {
      console.warn('SessionStorage unavailable');
    }

  }


  // ======================================
  // 5. 初始化逾時監測
  // ======================================

  function withTimeout(promise, ms) {

    let timer;

    const timeoutPromise = new Promise(
      (resolve, reject) => {

        timer = setTimeout(() => {
          reject(
            new Error(
              'LIFF 初始化超過 ' +
              (ms / 1000) +
              ' 秒，請檢查網路或 LIFF 設定。'
            )
          );
        }, ms);

      }
    );

    return Promise.race([
      Promise.resolve(promise),
      timeoutPromise
    ]).finally(() => {

      clearTimeout(timer);

    });

  }


  // ======================================
  // 6. LINE 登入
  // ======================================

  function startLogin(force = false) {

    const alreadyAttempted =
      loginAttemptedInThisPage ||
      getLoginAttempt() === '1';

    if (alreadyAttempted && !force) {

      showLoginRetry(
        'LINE 連線尚未完成，請點擊下方重新連結 LINE。'
      );

      return;

    }

    setLoginAttempt();

    setStatus('正在連結 LINE，請稍候...');

    try {

      // 不指定 redirectUri。
      // 使用 LINE Developers Console 設定的 Endpoint URL。
      liff.login();

    } catch (error) {

      clearLoginAttempt();

      throw error;

    }

  }


  // ======================================
  // 7. 建立 Google 表單網址
  // ======================================

  function buildFormUrl(displayName) {

    const url = new URL(FORM_BASE_URL);

    url.searchParams.set('usp', 'pp_url');

    if (NAME_ENTRY_ID) {

      url.searchParams.set(
        NAME_ENTRY_ID,
        displayName
      );

    }

    return url.toString();

  }


  // ======================================
  // 8. 開啟外部 Google 表單
  // ======================================

  function openExternalForm() {

    if (!finalFormUrl) {
      return;
    }

    try {

      // 使用 LINE 提供的外部瀏覽器開啟 API
      liff.openWindow({
        url: finalFormUrl,
        external: true
      });

    } catch (error) {

      console.error(
        'LIFF openWindow failed:',
        error
      );

      // 備用：使用 HTML 連結進行頂層導覽
      formFallback.click();

    }

  }


  openFormButton.addEventListener(
    'click',
    openExternalForm
  );


  loginRetryButton.addEventListener(
    'click',
    () => {

      clearLoginAttempt();

      try {

        startLogin(true);

      } catch (error) {

        handleError(error);

      }

    }
  );


  // ======================================
  // 9. 主要 LIFF 初始化流程
  // ======================================

  async function initLiff() {

    if (!window.liff) {

      throw new Error(
        'LIFF SDK 載入失敗，請檢查網路連線。'
      );

    }

    // 必須在初始化前記錄環境。
    // isInClient() 可在初始化前使用。
    const inLiffBrowser = liff.isInClient();

    setStatus('正在準備簽到...');

    const currentPage = new URL(window.location.href);

    detailElement.textContent =
      '執行網域：' + currentPage.origin +
      ' | 路徑：' + currentPage.pathname +
      ' | LIFF SDK：' + typeof window.liff;

    console.log('[網址診斷]', {
      origin: currentPage.origin,
      pathname: currentPage.pathname,
      sdkLoaded: typeof window.liff
    });

    // 使用手動登入流程。
    // 不啟用自動外部瀏覽器登入，避免重複處理。
    await withTimeout(

      Promise.resolve().then(() => {

        return liff.init({

          liffId: LIFF_ID,

          withLoginOnExternalBrowser: false

        });

      }),

      INIT_TIMEOUT

    );


    // 診斷資訊
    console.info('[LIFF Diagnostics]', {

      sdkVersion: liff.getVersion(),

      os: liff.getOS(),

      isInClient: liff.isInClient(),

      isLoggedIn: liff.isLoggedIn(),

    });


    // ==================================
    // 10. 判斷登入狀態
    // ==================================

    if (!liff.isLoggedIn()) {

      if (inLiffBrowser) {

        // LIFF Browser 不可再次呼叫 liff.login()
        setStatus(
          '簽到頁面已開啟，但尚未取得 LINE 登入狀態。'
        );

        restartLiffLink.href = LIFF_URL;

        restartLiffLink.hidden = false;

        return;

      }

      // 一般 LINE 內建瀏覽器或外部瀏覽器
      startLogin();

      return;

    }


    // 登入成功，清除登入紀錄
    clearLoginAttempt();


    // ==================================
    // 11. 取得 LINE Profile
    // ==================================

    setStatus('LINE 已連線，正在確認簽到身分...');

    const profile = await withTimeout(

      liff.getProfile(),

      15000

    );

    if (!profile || !profile.displayName) {

      throw new Error(
        '無法取得 LINE 使用者名稱。'
      );

    }


    // ==================================
    // 12. 建立 Google 表單網址
    // ==================================

    finalFormUrl = buildFormUrl(
      profile.displayName
    );

    formFallback.href = finalFormUrl;


    // 顯示資料
    profileName.textContent =
      '你好，' + profile.displayName +
      '！LINE 身分確認成功。';

    profileSection.hidden = false;


    setStatus(
      '身分確認完成！',
      '請點擊下方按鈕，前往簽到表單完成簽到。'
    );

  }


  // ======================================
  // 13. 錯誤處理
  // ======================================

  function handleError(error) {

    console.error(
      '[LIFF ERROR]',
      error
    );

    const code =
      error && error.code
        ? '[' + error.code + '] '
        : '';

    const message =
      error && error.message
        ? error.message
        : String(error);

    setStatus(
      '簽到頁面發生錯誤',
      code + message
    );

  }


  // ======================================
  // 14. 啟動
  // ======================================

  initLiff().catch(handleError);

})();
</script>

</body>
</html>
